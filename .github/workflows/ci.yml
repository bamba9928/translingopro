name: CI

# Vérifie chaque push sur main et chaque pull request (dont celles de
# Dependabot) : configuration Django, migrations à jour et tests.
# Push sur main uniquement : déploiement sur le VPS si les tests passent et si
# les secrets de déploiement sont définis (sinon l'étape est sautée).
#
# Secrets à définir (Settings → Secrets and variables → Actions) :
#   DEPLOY_SSH_KEY      clé privée dédiée, restreinte côté serveur à
#                       /home/mada/deploy_translingopro.sh (authorized_keys :
#                       restrict,command=...)
#   DEPLOY_KNOWN_HOSTS  empreinte du serveur, vérifiée à la main une fois
#   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, on n'interrompt jamais un run : il peut être en plein déploiement.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lingoservices

    # Clé factice propre au CI ; DEBUG reste coupé, comme en production.
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: lingoservices/requirements.txt

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Vérification Django
        run: python manage.py check

      # Un modèle modifié sans migration commitée casserait la prod.
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      # --top-level-directory : lingoservices/__init__.py fait du dossier du
      # projet un paquet, ce qui fausse la découverte des tests sans cette option.
      - name: Tests
        run: python manage.py test --top-level-directory . --verbosity 2

  deploy:
    name: Déploiement
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Jamais deux déploiements en parallèle ; on laisse finir celui en cours.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Secrets de déploiement présents ?
        id: secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEPLOY_SSH_KEY absent : déploiement sauté (voir l'en-tête de ci.yml)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.secrets.outputs.ok == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte du serveur figée dans un secret : pas de ssh-keyscan,
          # donc pas de confiance aveugle au premier contact.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # La clé est restreinte côté serveur (authorized_keys : restrict +
      # command=) : la connexion exécute uniquement le lanceur, qui met le
      # clone à jour puis lance deploy.sh (sauvegarde, copie du code, pip,
      # migrate, collectstatic, redémarrage de gunicorn, healthcheck).
      - name: Déployer sur le VPS
        if: steps.secrets.outputs.ok == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Vérifier le site en production
        if: steps.secrets.outputs.ok == 'true'
        run: |
          for path in / /robots.txt; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
              "https://translingopro.com${path}"
            echo "OK ${path}"
          done
