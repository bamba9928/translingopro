name: CI

# Vérifie chaque push sur main et chaque pull request (dont celles de
# Dependabot) : configuration Django, migrations à jour et tests.
# Aucun déploiement ici.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lingoservices

    # Clé factice propre au CI ; DEBUG reste coupé, comme en production.
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: lingoservices/requirements.txt

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Vérification Django
        run: python manage.py check

      # Un modèle modifié sans migration commitée casserait la prod.
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      # --top-level-directory : lingoservices/__init__.py fait du dossier du
      # projet un paquet, ce qui fausse la découverte des tests sans cette option.
      - name: Tests
        run: python manage.py test --top-level-directory . --verbosity 2
